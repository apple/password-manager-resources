name: Lint

permissions:
  contents: read

on: [push, pull_request]

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Check for trailing whitespace
      run: |
        if git grep -InP '[ \t]+$'; then
          echo "Error: trailing whitespace found on the lines above"
          exit 1
        fi
    - name: Check for tab characters
      run: |
        if git grep -InP '\t'; then
          echo "Error: tab characters found on the lines above"
          exit 1
        fi

  change-password-urls:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Lint Sort Order
      run: cat quirks/change-password-URLs.json | sed '1,1d' | sed '$d' | sort -c

  password-rules:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Lint Sort Order
      run: cat quirks/password-rules.json | grep "^    \"" | sort -c
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
    - name: Lint Rules
      run: node .github/workflows/lint-scripts/password-rules-parse.js

  websites-shared-credentials:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Ruby
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        ruby-version: 3.3
    - name: Lint Sort Order
      run: ruby .github/workflows/lint-scripts/websites-shared-credentials-sort-order.rb
    - name: Lint Duplicates
      run: ruby .github/workflows/lint-scripts/websites-shared-credentials-duplicates.rb

  validate-schemas:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
    - name: Install ajv-cli
      run: npm install -g ajv-cli
    - name: Validate JSONs against their schemas
      run: ./tools/validate-json-schemas.sh

  pattern-regexp-converter:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Check whether converter files changed
      id: filter
      run: |
        set -eu
        if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
          git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"
          range="origin/${GITHUB_BASE_REF}...HEAD"
        elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
          range="${{ github.event.before }}...HEAD"
        else
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "Running converter tests (no diff base available)."
          exit 0
        fi

        echo "Diff range: $range"
        git diff --name-only "$range" | tee /tmp/changed-files.txt

        if grep -qE '^(tools/PatternRegexpToPasswordRulesConverter/|\.github/workflows/lint\.yml$)' /tmp/changed-files.txt; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "Skipping converter tests; no relevant files changed."
        fi
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: steps.filter.outputs.run == 'true'
    - name: Run PatternRegexpToPasswordRulesConverter tests
      if: steps.filter.outputs.run == 'true'
      run: ./tools/PatternRegexpToPasswordRulesConverter/run-tests.sh
